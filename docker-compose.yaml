services:
  web:
    build: .
    container_name: mtdc-web
    command: >
      gunicorn MTDC.wsgi:application
      --bind 127.0.0.1:8003
      --workers 4
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    volumes:
      - /var/www/media/mtdc:/app/MTDC/MTDC/media
      - /var/www/static/mtdc:/app/MTDC/MTDC/staticfiles
    network_mode: host
    restart: always

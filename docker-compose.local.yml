services:
  db:
    image: postgres:16
    container_name: mtdc-db
    environment:
      POSTGRES_DB: mtdc_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mtdc_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: mtdc-web-local
    working_dir: /app/MTDC
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

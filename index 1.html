<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <title>MTDC 3D Terrain</title>

    <!-- =========================================================
         CESIUM
    ========================================================== -->

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>

    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">


    <!-- =========================================================
         CSS
    ========================================================== -->

    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            font-family: Arial, sans-serif;

        }


        body {

            background: #111827;

        }


        /* =====================================================
           CESIUM CONTAINER
        ====================================================== */

        #cesiumContainer {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           LEFT LOCATION PANEL
        ====================================================== */

        #locationPanel {

            position: absolute;

            top: 15px;
            left: 15px;

            width: 320px;

            max-height: calc(100vh - 30px);

            z-index: 1000;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.30);

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           PANEL HEADER
        ====================================================== */

        .panel-header {

            padding: 16px;

            background: #0f172a;

            color: white;

        }


        .panel-title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .panel-subtitle {

            font-size: 12px;

            color: #cbd5e1;

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .search-container {

            padding: 12px;

            border-bottom: 1px solid #e5e7eb;

        }


        #locationSearch {

            width: 100%;

            padding: 10px 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

        }


        #locationSearch:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.15);

        }


        /* =====================================================
           LOCATION COUNT
        ====================================================== */

        .location-count {

            padding: 8px 12px;

            font-size: 12px;

            color: #64748b;

            background: #f8fafc;

            border-bottom: 1px solid #e5e7eb;

        }


        /* =====================================================
           LOCATION LIST
        ====================================================== */

        #locationList {

            overflow-y: auto;

            max-height: calc(100vh - 190px);

        }


        /* =====================================================
           LOCATION ITEM
        ====================================================== */

        .location-item {

            width: 100%;

            padding: 12px;

            border: none;

            border-bottom: 1px solid #e5e7eb;

            background: white;

            text-align: left;

            cursor: pointer;

            transition: all 0.15s ease;

        }


        .location-item:hover {

            background: #f1f5f9;

        }


        .location-item.active {

            background: #dbeafe;

            border-left: 4px solid #2563eb;

        }


        .location-row {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        /* =====================================================
           3D ICON
        ====================================================== */

        .location-icon {

            width: 34px;

            height: 34px;

            flex: 0 0 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #dbeafe;

            color: #2563eb;

            border-radius: 50%;

            font-size: 12px;

            font-weight: 700;

        }


        /* =====================================================
           LOCATION NAME
        ====================================================== */

        .location-name {

            font-size: 14px;

            font-weight: 700;

            color: #0f172a;

            margin-bottom: 4px;

        }


        /* =====================================================
           COORDINATES
        ====================================================== */

        .location-coordinates {

            font-size: 11px;

            color: #64748b;

        }


        /* =====================================================
           EMPTY MESSAGE
        ====================================================== */

        .empty-message {

            padding: 25px;

            text-align: center;

            color: #64748b;

            font-size: 13px;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .panel-footer {

            padding: 10px;

            border-top: 1px solid #e5e7eb;

            background: #f8fafc;

        }


        /* =====================================================
           RESET BUTTON
        ====================================================== */

        #resetView {

            width: 100%;

            padding: 9px 12px;

            border: none;

            border-radius: 7px;

            background: #0f172a;

            color: white;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

        }


        #resetView:hover {

            background: #1e293b;

        }


        /* =====================================================
           LOCATION INFORMATION
        ====================================================== */

        #locationInfo {

            position: absolute;

            right: 20px;

            bottom: 20px;

            z-index: 1000;

            min-width: 270px;

            padding: 12px 15px;

            background: rgba(15, 23, 42, 0.90);

            color: white;

            border-radius: 9px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            display: none;

        }


        .info-title {

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .info-coordinates {

            font-size: 11px;

            color: #cbd5e1;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            #locationPanel {

                width: calc(100% - 30px);

                max-height: 45vh;

            }


            #locationList {

                max-height: 28vh;

            }


            #locationInfo {

                left: 15px;

                right: 15px;

                bottom: 15px;

                min-width: 0;

            }

        }
    </style>

</head>


<body>


    <!-- =========================================================
         CESIUM
    ========================================================== -->

    <div id="cesiumContainer"></div>


    <!-- =========================================================
         LOCATION PANEL
    ========================================================== -->

    <div id="locationPanel">


        <!-- Header -->

        <div class="panel-header">

            <div class="panel-title">

                MTDC 3D Locations

            </div>


            <div class="panel-subtitle">

                Select a location to view the 3D terrain

            </div>

        </div>


        <!-- Search -->

        <div class="search-container">

            <input type="text" id="locationSearch" placeholder="Search location...">

        </div>


        <!-- Count -->

        <div class="location-count" id="locationCount">

            0 locations

        </div>


        <!-- Location List -->

        <div id="locationList"></div>


        <!-- Footer -->

        <div class="panel-footer">

            <button id="resetView">

                Reset View

            </button>

        </div>


    </div>


    <!-- =========================================================
         LOCATION INFO
    ========================================================== -->

    <div id="locationInfo">

        <div class="info-title" id="infoTitle">
            Location
        </div>


        <div class="info-coordinates" id="infoCoordinates">
            -
        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>


        /* =====================================================
           CESIUM ION TOKEN
        ====================================================== */

        Cesium.Ion.defaultAccessToken =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1MTg3YzI0ZC1jZDRkLTRkYTktYTU2ZC1kOWQyOWMwZTgyMjYiLCJpZCI6NDQ1MTg4LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODE2MDkxNjd9.MS-pZLFL8-QP7yJto9dOdk-krxDWKRdqSFSEMV3nnT8";


        /* =====================================================
           TERRAIN URL

           This is your working Quantized Mesh terrain.
        ====================================================== */

        const TERRAIN_URL =
            "https://mtdc.lrms.rottengrapes.tech/dsm_terrain/";


        /* =====================================================
           3D LOCATIONS

           Replace these sample coordinates with
           your actual locations.
        ====================================================== */

        const locations3D = [

            {
                id: 1,

                name: "MTDC Location 1",

                lon: 73.1094402,

                lat: 18.9269580
            },


            {
                id: 2,

                name: "MTDC Location 2",

                lon: 73.1200000,

                lat: 18.9350000
            },


            {
                id: 3,

                name: "MTDC Location 3",

                lon: 73.1300000,

                lat: 18.9450000
            },


            {
                id: 4,

                name: "MTDC Location 4",

                lon: 73.1400000,

                lat: 18.9550000
            },


            {
                id: 5,

                name: "MTDC Location 5",

                lon: 73.1471498,

                lat: 18.9715050
            }

        ];


        /* =====================================================
           GLOBAL VARIABLES
        ====================================================== */

        let viewer = null;

        let terrainProvider = null;

        let selectedEntity = null;


        /* =====================================================
           DOM ELEMENTS
        ====================================================== */

        const locationList =
            document.getElementById(
                "locationList"
            );


        const locationSearch =
            document.getElementById(
                "locationSearch"
            );


        const locationCount =
            document.getElementById(
                "locationCount"
            );


        const resetView =
            document.getElementById(
                "resetView"
            );


        const locationInfo =
            document.getElementById(
                "locationInfo"
            );


        const infoTitle =
            document.getElementById(
                "infoTitle"
            );


        const infoCoordinates =
            document.getElementById(
                "infoCoordinates"
            );


        /* =====================================================
           DEFAULT VIEW

           Same extent that was working in your
           original HTML.
        ====================================================== */

        const defaultRectangle =
            Cesium.Rectangle.fromDegrees(

                73.1094402,

                18.9269580,

                73.1471498,

                18.9715050

            );


        /* =====================================================
           FLY TO LOCATION
        ====================================================== */

        function flyToLocation(location) {


            /* -------------------------------------------------
               Remove previous marker
            ------------------------------------------------- */

            if (selectedEntity) {

                viewer.entities.remove(
                    selectedEntity
                );

                selectedEntity = null;

            }


            /* -------------------------------------------------
               Create new marker
            ------------------------------------------------- */

            selectedEntity =
                viewer.entities.add({

                    name: location.name,


                    position:
                        Cesium.Cartesian3.fromDegrees(

                            location.lon,

                            location.lat,

                            0

                        ),


                    point: {

                        pixelSize: 14,

                        color:
                            Cesium.Color.RED,

                        outlineColor:
                            Cesium.Color.WHITE,

                        outlineWidth: 3,

                        heightReference:
                            Cesium.HeightReference
                                .CLAMP_TO_GROUND

                    },


                    label: {

                        text: location.name,

                        font:
                            "14px sans-serif",

                        fillColor:
                            Cesium.Color.WHITE,

                        outlineColor:
                            Cesium.Color.BLACK,

                        outlineWidth: 3,

                        style:
                            Cesium.LabelStyle
                                .FILL_AND_OUTLINE,

                        verticalOrigin:
                            Cesium.VerticalOrigin
                                .BOTTOM,

                        pixelOffset:
                            new Cesium.Cartesian2(
                                0,
                                -18
                            )

                    }

                });


            /* -------------------------------------------------
               Fly camera

               IMPORTANT:
               700m camera height
               -55 degree pitch
            ------------------------------------------------- */

            viewer.camera.flyTo({

                destination:
                    Cesium.Cartesian3.fromDegrees(

                        location.lon,

                        location.lat,

                        700

                    ),


                orientation: {

                    heading:
                        Cesium.Math.toRadians(0),

                    pitch:
                        Cesium.Math.toRadians(-55),

                    roll: 0

                },


                duration: 2.5

            });


            /* -------------------------------------------------
               Remove previous active state
            ------------------------------------------------- */

            document
                .querySelectorAll(
                    ".location-item"
                )
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


            /* -------------------------------------------------
               Activate selected item
            ------------------------------------------------- */

            const activeItem =
                document.querySelector(

                    `.location-item[data-id="${location.id}"]`

                );


            if (activeItem) {

                activeItem.classList.add(
                    "active"
                );


                activeItem.scrollIntoView({

                    behavior: "smooth",

                    block: "nearest"

                });

            }


            /* -------------------------------------------------
               Location information
            ------------------------------------------------- */

            infoTitle.textContent =
                location.name;


            infoCoordinates.textContent =
                `Lon: ${location.lon.toFixed(6)}
                 | Lat: ${location.lat.toFixed(6)}`;


            locationInfo.style.display =
                "block";

        }


        /* =====================================================
           RENDER LOCATION LIST
        ====================================================== */

        function renderLocationList(
            locations
        ) {


            locationList.innerHTML = "";


            /* -------------------------------------------------
               Count
            ------------------------------------------------- */

            locationCount.textContent =
                `${locations.length} ${locations.length === 1
                    ? "location"
                    : "locations"
                }`;


            /* -------------------------------------------------
               Empty
            ------------------------------------------------- */

            if (locations.length === 0) {

                locationList.innerHTML = `

                    <div class="empty-message">

                        No 3D locations found.

                    </div>

                `;

                return;

            }


            /* -------------------------------------------------
               Create items
            ------------------------------------------------- */

            locations.forEach(
                location => {


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "location-item";


                    button.dataset.id =
                        location.id;


                    button.innerHTML = `

                        <div class="location-row">


                            <div class="location-icon">

                                3D

                            </div>


                            <div>


                                <div class="location-name">

                                    ${location.name}

                                </div>


                                <div class="location-coordinates">

                                    ${location.lon.toFixed(6)},
                                    ${location.lat.toFixed(6)}

                                </div>


                            </div>


                        </div>

                    `;


                    /* -----------------------------------------
                       Click
                    ------------------------------------------ */

                    button.addEventListener(
                        "click",
                        function () {

                            flyToLocation(
                                location
                            );

                        }
                    );


                    locationList.appendChild(
                        button
                    );

                }
            );

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        locationSearch.addEventListener(
            "input",
            function () {


                const searchText =
                    this.value
                        .trim()
                        .toLowerCase();


                /* ---------------------------------------------
                   Empty search
                ---------------------------------------------- */

                if (!searchText) {

                    renderLocationList(
                        locations3D
                    );

                    return;

                }


                /* ---------------------------------------------
                   Filter
                ---------------------------------------------- */

                const filteredLocations =
                    locations3D.filter(
                        location =>

                            location.name
                                .toLowerCase()
                                .includes(
                                    searchText
                                )

                    );


                renderLocationList(
                    filteredLocations
                );

            }
        );


        /* =====================================================
           RESET VIEW
        ====================================================== */

        resetView.addEventListener(
            "click",
            function () {


                /* ---------------------------------------------
                   Camera
                ---------------------------------------------- */

                viewer.camera.flyTo({

                    destination:
                        defaultRectangle,

                    duration: 2.5

                });


                /* ---------------------------------------------
                   Remove marker
                ---------------------------------------------- */

                if (selectedEntity) {

                    viewer.entities.remove(
                        selectedEntity
                    );

                    selectedEntity = null;

                }


                /* ---------------------------------------------
                   Remove active state
                ---------------------------------------------- */

                document
                    .querySelectorAll(
                        ".location-item"
                    )
                    .forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );


                /* ---------------------------------------------
                   Hide info
                ---------------------------------------------- */

                locationInfo.style.display =
                    "none";

            }
        );


        /* =====================================================
           START CESIUM
        ====================================================== */

        async function startApp() {


            try {


                console.log(
                    "Loading MTDC DSM terrain..."
                );


                /* ------------------------------------------------
                   LOAD QUANTIZED MESH TERRAIN
                ------------------------------------------------ */

                terrainProvider =
                    await Cesium.createWorldTerrainAsync({

                        requestVertexNormals:
                            true

                    });

                console.log(
                    "Terrain provider loaded"
                );


                /* ------------------------------------------------
                   CREATE VIEWER
                ------------------------------------------------ */

                viewer =
                    new Cesium.Viewer(

                        "cesiumContainer",

                        {

                            terrainProvider:
                                terrainProvider,


                            timeline:
                                false,


                            animation:
                                false,


                            baseLayerPicker:
                                true,


                            geocoder:
                                false,


                            homeButton:
                                true,


                            sceneModePicker:
                                true,


                            fullscreenButton:
                                true,


                            navigationHelpButton:
                                false

                        }

                    );


                /* ------------------------------------------------
                   TERRAIN SETTINGS
                ------------------------------------------------ */

                viewer.scene.globe
                    .depthTestAgainstTerrain =
                    true;


                viewer.scene.globe
                    .enableLighting =
                    true;


                /*
                 * TEMPORARY DSM EXAGGERATION
                 *
                 * 3 = terrain height visually exaggerated 3x
                 *
                 * Once everything looks correct,
                 * change this to 1.0.
                 */

                viewer.scene
                    .verticalExaggeration =
                    3.0;


                /* ------------------------------------------------
                   INITIAL CAMERA
                ------------------------------------------------ */

                viewer.camera.flyTo({

                    destination:
                        defaultRectangle,

                    duration: 3

                });


                /* ------------------------------------------------
                   LOAD LOCATION LIST
                ------------------------------------------------ */

                renderLocationList(
                    locations3D
                );


                console.log(
                    "Terrain loaded successfully"
                );


            }
            catch (error) {


                console.error(
                    "Terrain loading failed:",
                    error
                );


                alert(
                    "Failed to load 3D terrain. Check browser console."
                );

            }

        }


        /* =====================================================
           START
        ====================================================== */

        startApp();

    </script>

</body>

</html>
